<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Guardian verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1a202c;--muted:#4a5568;--line:#e2e8f0;--ok:#22543d;--bad:#9b2c2c}
@media (prefers-color-scheme: dark){:root{--bg:#171923;--fg:#e2e8f0;--muted:#a0aec0;--line:#2d3748;--ok:#68d391;--bad:#fc8181}}
body{font-family:system-ui,sans-serif;margin:0 auto;padding:16px;max-width:480px;background:var(--bg);color:var(--fg)}
#relay-container{border:1px solid var(--line);border-radius:8px;min-height:120px;margin:12px 0}
.muted{color:var(--muted);font-size:14px}#status{font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:15px;cursor:pointer}
</style></head><body>
<h1>Guardian</h1>
<p>Before Guardian may lock a card for you, Persona checks that a real person is behind it. Guardian only
learns <b>passed</b> or <b>failed</b>. It never sees your ID or face.</p>
<div id="relay-container"></div>
<p id="status" role="status" aria-live="polite" class="muted">Starting…</p>
<button id="again" hidden>Check again</button>
<p class="muted">Sandbox: claims always pass here. This proves the connection works, not how a failure looks.</p>
<script src="/relay.js"></script>
<script>
const Relay = window.Relay.default || window.Relay;
const statusEl = document.getElementById("status");
const again = document.getElementById("again");
let widget, sessionId;
function say(text, cls) { statusEl.textContent = text; statusEl.className = cls || "muted"; }
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "request failed");
  return data;
}
async function begin() {
  again.hidden = true; say("Starting…");
  if (widget) { widget.destroy(); widget = null; }
  try {
    const s = await post("/api/session");
    sessionId = s.sessionId;
    widget = new Relay(document.getElementById("relay-container"), {
      accessToken: s.accessToken, theme: "auto",
      onComplete: async () => {
        say("Checking…");
        try {
          const out = await post("/api/result", { sessionId });
          say(out.result === "passed" ? "Verified: Guardian may lock cards for you." : "Not verified: card locks will wait for you.",
              out.result === "passed" ? "ok" : "bad");
        } catch (e) { say(e.message, "bad"); again.hidden = false; }
      },
      onExpire: () => { say("That took too long. Starting a new check…"); begin(); },
      onError: (e) => { say("Something went wrong with the check.", "bad"); again.hidden = false; console.error(e); },
    });
    say("Follow the steps above.");
  } catch (e) { say(e.message, "bad"); again.hidden = false; }
}
again.addEventListener("click", begin);
begin();
</script></body></html>
